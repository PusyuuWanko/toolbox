<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        .message {
            font-size: 5rem;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }
        
        .message span {
          color: #00ff00;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 1.5s infinite;
        }

        @keyframes twinkle {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">404<span>Not Found.</span></div>
        <div class="stars" id="stars"></div>
    </div>

    <script>
        const numStars = 150;
        const starContainer = document.getElementById('stars');

        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            const left = Math.random() * 100;
            const top = Math.random() * 100;
            const animationDuration = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = left + 'vw';
            star.style.top = top + 'vh';
            star.style.animationDuration = animationDuration + 's';
            return star;
        }

        function populateStars() {
            for (let i = 0; i < numStars; i++) {
                starContainer.appendChild(createStar());
            }
        }

        populateStars();
    </script>
</body>
</html>
